name: Actualizar datos del BOE

on:
  schedule:
    - cron: "30 6 * * *"   # cada día, sobre las 7:30 (hora de Madrid en invierno)
  workflow_dispatch:         # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasar los tests
        run: |
          pip install pytest
          python -m pytest -q
      - name: Descargar convocatorias y exámenes
        run: python -m oposiciones.actualizar convocatorias --dias 7
        working-directory: scripts
      - name: Descargar normas (solo las que han cambiado)
        run: python -m oposiciones.actualizar normas
        working-directory: scripts
      - name: Leer las convocatorias de las comunidades autónomas
        run: python -m oposiciones.actualizar autonomicas
        working-directory: scripts
        continue-on-error: true
      - name: Extraer el temario oficial de las convocatorias
        run: python -m oposiciones.actualizar temarios
        working-directory: scripts
      - name: Comprobar que los enlaces siguen funcionando
        run: python -m oposiciones.actualizar enlaces
        working-directory: scripts
        continue-on-error: true
      - name: Generar páginas, avisos y mapa del sitio
        run: python -m oposiciones.actualizar publicar
        working-directory: scripts
      - name: Guardar cambios
        run: |
          git config user.name "robot-oposiciones"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/oposicion site/sitemap.xml site/robots.txt
          git diff --cached --quiet || git commit -m "Actualizar datos del BOE"
          git push
      - name: Volver a publicar la web
        # Un push hecho por el robot no lanza otros workflows, así que se pide la publicación expresamente.
        run: gh workflow run publicar.yml
        env:
          GH_TOKEN: ${{ github.token }}
